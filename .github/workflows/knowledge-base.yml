name: Knowledge Base

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  wiki:
    runs-on: ubuntu-latest
    env:
      UZERA_SCANNER_KEY: ${{ secrets.UZERA_SCANNER_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Uzera CLI
        run: |
          curl -fsSL "https://api.uzera.com/api/uzera/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Index repository
        run: uzera index --project "${{ github.workspace }}"

      - name: Upload wiki
        run: uzera wiki push --project "${{ github.workspace }}"
